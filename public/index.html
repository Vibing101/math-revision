<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Επανάληψη Μαθηματικών Γυμνασίου ανά κεφάλαιο και για το τέλος της χρονιάς.">
<title>Επανάληψη Μαθηματικών</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9E%97%3C/text%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}

/* Layout: single centered column; home = category grid, practice = one question card at a time */
:root{
  --bg:#f3f6f9; --card:#ffffff; --fg:#14202b; --muted:#5b6b7a; --line:#d3dce5;
  --accent:#1d5f8a; --accent-ink:#ffffff; --sun:#f2a516; --sun-soft:#fff3d6;
  --ok:#11804a; --ok-soft:#e3f6eb; --bad:#c2392b; --bad-soft:#fdecea; --chip:#e6eef5;
  --display:"Comfortaa","Noto Sans",system-ui,sans-serif; --body:"Noto Sans",system-ui,sans-serif;
  --paper:rgba(29,95,138,.07); --marker:#fde68a; --info:#fff7e0;
  --m2:#2563eb; --m1:#15803d; --m0:#c2410c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --card:#17222c; --fg:#e5edf4; --muted:#93a4b4; --line:#2c3b48;
  --accent:#6fb3e3; --accent-ink:#0b1620; --sun:#f5b941; --sun-soft:#3a2d10;
  --ok:#5fd394; --ok-soft:#123326; --bad:#f08072; --bad-soft:#3a1916; --chip:#22313d; color-scheme:dark;
  --paper:rgba(255,255,255,.035); --marker:rgba(250,204,21,.38); --info:#2e2610; --m2:#7cb4ff; --m1:#5fd394; --m0:#f5b941}}
:root[data-theme="dark"]{
  --bg:#0f161d; --card:#17222c; --fg:#e5edf4; --muted:#93a4b4; --line:#2c3b48;
  --accent:#6fb3e3; --accent-ink:#0b1620; --sun:#f5b941; --sun-soft:#3a2d10;
  --ok:#5fd394; --ok-soft:#123326; --bad:#f08072; --bad-soft:#3a1916; --chip:#22313d; color-scheme:dark;
  --paper:rgba(255,255,255,.035); --marker:rgba(250,204,21,.38); --info:#2e2610; --m2:#7cb4ff; --m1:#5fd394; --m0:#f5b941}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* the page is a sheet of squared exercise paper; cards sit on it */
body{background-color:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:var(--lh,1.55);
  background-image:linear-gradient(var(--paper) 1px,transparent 1px),linear-gradient(90deg,var(--paper) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.65rem}
h2{font-size:1.2rem}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-weight:700}
.btn{border:0;border-radius:12px;padding:8px 20px;min-height:44px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sun{background:var(--accent);color:var(--accent-ink)}
.btn.big-btn{min-height:48px;padding:8px 24px;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero{display:flex;flex-direction:column;gap:12px}
.level{display:flex;flex-direction:column;gap:8px}
.bar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cat{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;color:var(--fg);display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.cat:hover{border-color:var(--accent)}
.cat .t{font-weight:700}
.cat .d{font-size:.88rem;color:var(--muted)}
.cat .bar{height:6px}
.cat .bar>i{background:var(--ok)}
.cat.focus{border-color:var(--sun)}
.tag{display:inline-block;font-size:.85rem;font-weight:600;background:var(--sun-soft);color:var(--fg);border-radius:6px;padding:0 8px;align-self:flex-start}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:.85rem;border:1.5px solid var(--sun);border-radius:999px;padding:4px 12px}
.badge.off{border-color:var(--line);color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.qtext{font-size:1.05rem}
/* an expression never breaks over two lines; a long one scrolls sideways */
.big{display:inline-block;max-width:100%;overflow-x:auto;white-space:nowrap;vertical-align:bottom;font-size:1.6rem;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums;padding:0 2px}
.gap{display:inline-block;min-width:1.1em;border-bottom:3px solid var(--sun);color:var(--sun);text-align:center}
.group{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.group>.gl{font-weight:600}
.part{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-radius:12px;border:2px solid transparent}
.part.miss{border-color:var(--sun);border-style:dashed}
.part.ok{border-color:var(--ok);background:var(--ok-soft)}
.part.bad{border-color:var(--bad);background:var(--bad-soft)}
.part label{min-width:0}
input.num{width:7.5em;min-height:44px;font:inherit;font-size:1.1rem;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-variant-numeric:tabular-nums}
input.ex{width:2.4em;font:inherit;font-size:.85rem;padding:2px 4px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);text-align:center;vertical-align:super}
select{font:inherit;min-height:44px;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);max-width:100%}
.exprow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px;font-size:1.2rem;font-weight:700}
.exprow .dot{color:var(--muted);padding:0 2px}
.tog{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;min-width:44px;min-height:44px;padding:8px 12px;font-weight:700}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hints{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hints:empty,#fb:empty{display:none}
#fb{margin-top:12px}
.hint{background:var(--sun-soft);border-left:4px solid var(--sun);border-radius:6px;padding:8px 12px;font-size:.95rem}
.fb{border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.fb.info{background:var(--info);border:1.5px solid var(--sun)}
.fb.ok{background:var(--ok-soft);border:1.5px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1.5px solid var(--bad)}
.fb .h{font-weight:700}
.sol{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
table.ladder{border-collapse:collapse;margin:6px 0;font-variant-numeric:tabular-nums}
table.ladder td{padding:1px 10px;text-align:right}
table.ladder td:first-child{border-right:2px solid var(--fg)}
.ladders{display:flex;flex-wrap:wrap;gap:18px}
.tbl{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
table.st th,table.st td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.pop{position:fixed;pointer-events:none;font-weight:800;color:var(--sun);font-size:1.3rem;z-index:20;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:20;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop,.spark{display:none}.bar>i{transition:none}}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);border-radius:8px;padding:8px 12px}

.sec{font-size:.9rem;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.setgrid{display:flex;flex-wrap:wrap;gap:6px}
.setgrid .tog{min-width:44px}
.pin{display:flex;flex-direction:column;gap:12px;max-width:340px}
.pin input{font:inherit;font-size:1.6rem;letter-spacing:.4em;text-align:center;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-weight:600}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tools .card{display:flex;flex-direction:column;gap:8px}
.loading{color:var(--muted);padding:20px 0}
.cat.year{border-color:var(--sun);background:var(--sun-soft)}
.cat.chap .t{font-family:var(--display);font-size:1.15rem}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.chk:has(input:checked){border-color:var(--accent)}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
table.st th[colspan]{background:var(--chip)}
/* learning support: settings, calm mode, break reminder, one-card mode */
.prefs-btn{position:fixed;left:12px;bottom:12px;z-index:30;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font-size:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.prefs-btn .ic{width:22px;height:22px}
@media (max-width:640px){.prefs-btn{width:48px;height:48px;padding:0;justify-content:center}.prefs-btn span{display:none}}
body{padding-bottom:84px}
.tnav{position:sticky;bottom:10px;z-index:15;justify-content:center;gap:10px;padding:10px 12px 10px 64px;background:var(--bg);border-radius:16px;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
@media (min-width:641px){.tnav{padding-left:12px}}
dialog.prefs{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);padding:20px;max-width:min(30rem,calc(100vw - 24px));width:100%}
dialog.prefs::backdrop{background:rgba(0,0,0,.45)}
dialog.prefs h2{margin-bottom:6px}dialog.prefs fieldset{border:0;padding:0;margin:14px 0}dialog.prefs legend{font-weight:700;margin-bottom:6px;padding:0}
.pseg{display:flex;flex-wrap:wrap;gap:8px}.segopt input{position:absolute;opacity:0}.segopt span{display:inline-flex;align-items:center;min-height:44px;padding:6px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.segopt input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}.segopt input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
.chk{display:flex;gap:12px;align-items:flex-start;margin:14px 0;cursor:pointer}.chk input{width:24px;height:24px;flex:none;margin-top:2px}
.brk{position:fixed;left:12px;right:12px;bottom:68px;z-index:29;max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.breaktime{font:700 3rem var(--display);text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
html.calm .stats,html.calm .badges,html.calm .pop,html.calm .spark{display:none!important}
html.calm *{animation:none!important;transition:none!important}
.tbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:6px}
.tbar .bar{height:8px}.tbar .row{align-items:center;justify-content:space-between}.tbar .cnt{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tu[hidden]{display:none}.one .tu:not(.cur){opacity:.62}.one .tu.cur .tcard{box-shadow:0 0 0 3px var(--sun)}
.tcard .listen{margin-top:8px}.tcard.check{border-left-color:var(--sun)}.tcard.check .tlabel{color:var(--fg)}
.rate{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.rate button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toc a.done{background:var(--ok-soft);color:var(--ok)}.toc a.done::before{content:"✓ "}
/* weekly target and mistakes list */
.goal{display:flex;flex-direction:column;gap:10px;margin:16px 0}.grow{display:flex;flex-direction:column;gap:6px}.grow .bar>i{background:var(--ok)}
.mklist{list-style:none;margin:12px 0;padding:0;display:flex;flex-direction:column;gap:10px}.mk{display:flex;flex-direction:column;gap:6px}.mk .row{margin-top:4px}
/* theory cards */
.vec{position:relative;display:inline-block;padding-top:.1em}.vec::after{content:"→";position:absolute;left:0;right:0;top:-.62em;text-align:center;font-size:.7em;line-height:1}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.toc a{background:var(--chip);border-radius:999px;padding:6px 14px;color:var(--fg);text-decoration:none;font-size:.92rem}
.tsec{margin:28px 0}.tsec>h2{margin-bottom:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:14px 18px;margin:12px 0;max-width:46rem}
.tcard .tlabel{display:block;font-size:.8rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.tcard .tbody p{margin:.35em 0}.tcard .tbody ul{margin:.35em 0;padding-left:1.2em}
.tcard.goal{border-left-color:var(--sun);background:var(--sun-soft)}.tcard.goal .tlabel{color:var(--fg)}
.tcard.rule{border-left-color:var(--ok)}.tcard.rule .tlabel{color:var(--ok)}
.tcard.warn{border-left-color:var(--bad)}.tcard.warn .tlabel{color:var(--bad)}
.tcard.ex{border-left-color:var(--m2)}.tcard.ex .tlabel{color:var(--m2)}
.tsteps{margin:.6em 0;padding-left:1.4em}.tsteps li{margin:.3em 0}.tcard .btn.sm{min-height:36px;padding:4px 14px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.85em;line-height:1.15;margin:0 .1em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.ov{text-decoration:overline}
.slots{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:1.1rem}
input.slot{width:3.6em;text-align:center}
.slots .pm.sm{min-width:36px;padding:4px}
.slots .pmrow{gap:4px}
.pm.sm{min-width:30px;padding:4px 6px;font-size:.85rem}
.root{display:inline-flex;align-items:center;gap:2px;font-size:1.3rem}
.root input{border-top:2px solid var(--fg)}
.gradechip{font-size:.92rem}
.cat.grade .t{font-family:var(--display);font-size:1.4rem}
.papers{display:flex;flex-direction:column;gap:12px}.paper{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.fig{display:block;max-width:100%;height:auto;margin:10px 0;color:var(--fg)}
.vec{position:relative;display:inline-block;padding-top:.3em}
.vec::before{content:"";position:absolute;left:.05em;right:.2em;top:.18em;border-top:1.5px solid currentColor}
.vec::after{content:"";position:absolute;right:.05em;top:.04em;width:.3em;height:.3em;border:solid currentColor;border-width:1.5px 1.5px 0 0;transform:rotate(45deg)}
.qtext .tbl table.st{margin:8px 0}
.pmrow{display:inline-flex;align-items:center;gap:8px}
.pm{min-width:44px;padding:8px}
.fracin{display:inline-flex;flex-direction:column;gap:3px;align-items:center}
.fracin input{width:5.5em;text-align:center}
.fracin input:first-child{border-bottom:3px solid var(--fg)}
.btn.sm{padding:6px 12px;font-size:.92rem}
.lvbtns{margin-top:10px}
dialog.lv{width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);color:var(--fg)}
dialog.lv::backdrop{background:rgba(5,12,18,.6)}
.lv-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lv-x{border:0;background:var(--chip);color:var(--fg);border-radius:999px;width:40px;height:40px;font-size:1.1rem;flex:none}
.lv-prog{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.lv-dots{display:flex;flex-wrap:wrap;gap:6px}
.lv-dot{width:34px;height:34px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font-weight:700;font-size:.9rem;padding:0}
.lv-dot.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.lv-dot.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lv-count{font-size:.9rem;font-variant-numeric:tabular-nums}
.lv-bar{margin-top:8px;height:6px}
.lv-st{margin-top:14px;font-size:1.15rem}
.lv-stage{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px 16px;min-height:130px;font-size:1.25rem;line-height:1.7;text-align:center;display:flex;flex-direction:column;justify-content:center;overflow-x:auto}
.lv-stage .lp{font-size:1rem;text-align:left}
.lv-stage .lp .big{font-size:1.35rem}
.lv-stage ol{text-align:left;margin:0;padding-left:1.4em;font-size:1.05rem}
.lv-stage .ladders{justify-content:center;font-size:1rem}
.lv-stage mark{background:var(--sun-soft);color:inherit;border-bottom:3px solid var(--sun);border-radius:4px;padding:0 .15em}
.lv-stage.in{animation:lvin .45s ease-out}
@keyframes lvin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lv-cap{margin:12px 0 0;font-size:1.02rem;line-height:1.6;color:var(--muted)}
.lv-cap .cur{color:var(--fg);background:var(--sun-soft);border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .15em}
.lv-note{margin:10px 0 0;font-size:.9rem;background:var(--sun-soft);border-radius:8px;padding:8px 12px}
.lv-ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.lv-ctrl .btn{flex:1 1 auto;min-height:44px}
.lv-opt{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:12px;font-size:.95rem}
.lv-auto{display:flex;align-items:center;gap:8px}
.lv-auto input{width:20px;height:20px;accent-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.lv-stage.in{animation:none}}

/* ---- quiet chrome, one bright moment ---- */
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 4px;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.link:hover{text-decoration:underline}
.stats{gap:16px}
.stat{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.stat b{color:var(--fg)} .fg{color:var(--fg)}
.mark{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 94%,transparent 94%);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.cont{display:flex;flex-direction:column;gap:8px;border:2px solid var(--accent)}
.cont-t{font-size:1.45rem;line-height:1.3}
.cont-row{margin-top:8px;justify-content:space-between}
.lvl{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.lvl .bar{height:8px}
.bdg{padding:0}
.bdg summary{display:flex;align-items:center;gap:8px;padding:16px 20px;min-height:44px;cursor:pointer;list-style:none}
.bdg summary::-webkit-details-marker{display:none}
.bdg summary::after{content:"";margin-left:auto;width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s}
.bdg[open] summary::after{transform:rotate(-135deg)}
.blist{list-style:none;margin:0;padding:0 20px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.blist li{display:flex;align-items:center;gap:8px;color:var(--muted)}
.blist li.got{color:var(--fg)} .blist li.got .ic{color:var(--sun)}
.secs{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.q{display:flex;flex-direction:column;gap:12px}
.q .group{margin-top:4px}
.qtext{font-size:1.1rem}
.rprog{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.rprog .bar{grid-column:1/-1;height:8px}
.lvbtns{gap:8px}
.lvbtns .muted{font-size:.95rem}
.btn.sm{min-height:40px;padding:4px 12px}
.actions{margin-top:4px}
.cnt{font-weight:400;opacity:.8;font-variant-numeric:tabular-nums}
.nb{display:inline-flex;align-items:center;gap:8px}
.nb .ic{color:var(--sun)}
.score{font-family:var(--display);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.m2{color:var(--m2)} .m1{color:var(--m1)} .m0{color:var(--m0)}
</style>
</head>

<div class="wrap" id="app"><p class="loading">Φόρτωση…</p></div>
<script src="/support.js"></script>
<script src="/mine.js"></script>
<script src="/app.js"></script>
</body>
