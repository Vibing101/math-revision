<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Εξάσκηση στη Διαιρετότητα για Μαθηματικά Α΄ Γυμνασίου: κριτήρια, πρώτοι παράγοντες, ΜΚΔ και ΕΚΠ.">
<title>Πρόκληση Διαιρετότητας</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}

/* Layout: single centered column; home = category grid, practice = one question card at a time */
:root{
  --bg:#f3f6f9; --card:#ffffff; --fg:#14202b; --muted:#5b6b7a; --line:#d3dce5;
  --accent:#1d5f8a; --accent-ink:#ffffff; --sun:#f2a516; --sun-soft:#fff3d6;
  --ok:#11804a; --ok-soft:#e3f6eb; --bad:#c2392b; --bad-soft:#fdecea; --chip:#e6eef5;
  --display:"Comfortaa","Noto Sans",system-ui,sans-serif; --body:"Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --card:#17222c; --fg:#e5edf4; --muted:#93a4b4; --line:#2c3b48;
  --accent:#6fb3e3; --accent-ink:#0b1620; --sun:#f5b941; --sun-soft:#3a2d10;
  --ok:#5fd394; --ok-soft:#123326; --bad:#f08072; --bad-soft:#3a1916; --chip:#22313d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --card:#17222c; --fg:#e5edf4; --muted:#93a4b4; --line:#2c3b48;
  --accent:#6fb3e3; --accent-ink:#0b1620; --sun:#f5b941; --sun-soft:#3a2d10;
  --ok:#5fd394; --ok-soft:#123326; --bad:#f08072; --bad-soft:#3a1916; --chip:#22313d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.65rem}
h2{font-size:1.2rem}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-weight:700}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sun{background:var(--sun);color:#1b1300}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero{display:flex;flex-direction:column;gap:10px}
.level{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cat{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;color:var(--fg);display:flex;flex-direction:column;gap:6px}
.cat:hover{border-color:var(--accent)}
.cat .t{font-weight:700}
.cat .d{font-size:.88rem;color:var(--muted)}
.cat .bar{height:6px}
.cat .bar>i{background:var(--ok)}
.cat.focus{border-color:var(--sun)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;background:var(--sun-soft);color:var(--fg);border-radius:6px;padding:1px 8px;align-self:flex-start}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.82rem;border:1.5px solid var(--sun);border-radius:999px;padding:2px 10px}
.badge.off{border-color:var(--line);color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qtext{font-size:1.05rem}
.big{font-size:1.6rem;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.gap{display:inline-block;min-width:1.1em;border-bottom:3px solid var(--sun);color:var(--sun);text-align:center}
.group{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.group>.gl{font-weight:600}
.part{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:1.5px solid transparent}
.part.ok{border-color:var(--ok);background:var(--ok-soft)}
.part.bad{border-color:var(--bad);background:var(--bad-soft)}
.part label{min-width:0}
input.num{width:7.5em;font:inherit;font-size:1.05rem;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-variant-numeric:tabular-nums}
input.ex{width:2.4em;font:inherit;font-size:.85rem;padding:2px 4px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);text-align:center;vertical-align:super}
select{font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);max-width:100%}
.exprow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px;font-size:1.2rem;font-weight:700}
.exprow .dot{color:var(--muted);padding:0 2px}
.tog{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;min-width:44px;padding:6px 10px;font-weight:700}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hints{display:flex;flex-direction:column;gap:6px}
.hint{background:var(--sun-soft);border-left:4px solid var(--sun);border-radius:6px;padding:8px 12px;font-size:.95rem}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft);border:1.5px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1.5px solid var(--bad)}
.fb .h{font-weight:700}
.sol{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
table.ladder{border-collapse:collapse;margin:6px 0;font-variant-numeric:tabular-nums}
table.ladder td{padding:1px 10px;text-align:right}
table.ladder td:first-child{border-right:2px solid var(--fg)}
.ladders{display:flex;flex-wrap:wrap;gap:18px}
.tbl{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
table.st th,table.st td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.pop{position:fixed;pointer-events:none;font-weight:800;color:var(--sun);font-size:1.3rem;z-index:20;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:20;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop,.spark{display:none}.bar>i{transition:none}}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);border-radius:8px;padding:8px 12px}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- maths helpers ---------- */
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const gcdA=a=>a.reduce(gcd), lcmA=a=>a.reduce(lcm);
const SUP={0:'⁰',1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹'};
const sup=n=>String(n).split('').map(d=>SUP[d]).join('');
function factor(n){const m={};let p=2;while(n>1){if(n%p===0){m[p]=(m[p]||0)+1;n/=p}else p++}return m}
function fmtPow(m){const ks=Object.keys(m).map(Number).filter(p=>m[p]>0).sort((a,b)=>a-b);return ks.length?ks.map(p=>p+(m[p]>1?sup(m[p]):'')).join('·'):'1'}
function fmtPowFull(m){const ks=Object.keys(m).map(Number).filter(p=>m[p]>0).sort((a,b)=>a-b);return ks.map(p=>p+sup(m[p])).join('·')}
const mapVal=m=>Object.keys(m).reduce((v,p)=>v*Math.pow(+p,m[p]),1);
function minMap(ms){const r={};const ps=new Set(ms.flatMap(m=>Object.keys(m)));for(const p of ps){const e=Math.min(...ms.map(m=>m[p]||0));if(e>0)r[p]=e}return r}
function maxMap(ms){const r={};const ps=new Set(ms.flatMap(m=>Object.keys(m)));for(const p of ps){r[p]=Math.max(...ms.map(m=>m[p]||0))}return r}
function ladder(n,limit){let rows='',x=n,p=2,c=0;while(x>1&&(limit==null||c<limit)){if(x%p===0){rows+=`<tr><td>${x}</td><td>${p}</td></tr>`;x/=p;c++}else p++}
  if(x===1)rows+='<tr><td>1</td><td></td></tr>';else rows+=`<tr><td>${x}</td><td>…</td></tr>`;return `<table class="ladder">${rows}</table>`}
const ladders=ns=>`<div class="ladders">${ns.map(n=>ladder(n)).join('')}</div>`;
const facLines=ns=>ns.map(n=>`${n} = ${fmtPow(factor(n))}`).join('<br>');
/* values of the LCM if one prime took a lower exponent (typical mistake) -> tag */
function lcmMistakes(nums){const ms=nums.map(factor),M=maxMap(ms),L=mapVal(M),out=new Map();
  for(const p in M)for(const m of ms){const e=m[p]||0;if(e<M[p])out.set(L/Math.pow(+p,M[p]-e),e===0?'lcm-missing':'lcm-min')}return out}
const DAYS=['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'];
const dayArt=d=>(d===5?'το ':'την ')+DAYS[d];
function tl(h){if(h===0)return '12:00 τα μεσάνυχτα (00:00)';if(h===12)return '12:00 το μεσημέρι';return h<12?`${h}:00 π.μ.`:`${h-12}:00 μ.μ. (${h}:00)`}

/* ---------- categories ---------- */
const CATS=[
 {id:'crit',t:'Κριτήρια διαιρετότητας',d:'Διαιρείται; Ποιο ψηφίο λείπει;'},
 {id:'eucl',t:'Ευκλείδεια διαίρεση',d:'Δ = δ·π + υ'},
 {id:'fact',t:'Πρώτοι παράγοντες',d:'Ανάλυση με τη «σκάλα»'},
 {id:'pow',t:'ΜΚΔ & ΕΚΠ με δυνάμεις',d:'Μικρότερος ή μεγαλύτερος εκθέτης;',focus:1},
 {id:'num',t:'ΜΚΔ & ΕΚΠ αριθμών',d:'Από την ανάλυση στο αποτέλεσμα'},
 {id:'gcdp',t:'Προβλήματα ΜΚΔ',d:'Ομάδες, δέματα, ανθοδέσμες'},
 {id:'time',t:'Προβλήματα ΕΚΠ: ώρες & μέρες',d:'Τρένα, πλοία, δορυφόροι',focus:1},
 {id:'years',t:'Προβλήματα ΕΚΠ: χρονιές',d:'Κομήτες και επετείους'},
 {id:'chal',t:'Προκλήσεις',d:'Αριθμός ανάμεσα σε δύο όρια'}
];
const TAGS={
 'lcm-min':'ΕΚΠ: πήρε τον μικρότερο εκθέτη αντί για τον μεγαλύτερο',
 'lcm-missing':'ΕΚΠ: ξέχασε πρώτο παράγοντα που υπάρχει μόνο σε έναν αριθμό',
 'gcd-noncommon':'ΜΚΔ: έβαλε πρώτο παράγοντα που δεν είναι κοινός',
 'gcd-max':'ΜΚΔ: πήρε τον μεγαλύτερο εκθέτη αντί για τον μικρότερο',
 'pow-mult':'Υπολόγισε δύναμη σαν πολλαπλασιασμό (π.χ. 5² = 10)',
 'not-least':'Βρήκε κοινό πολλαπλάσιο αλλά όχι το ελάχιστο',
 'not-greatest':'Βρήκε κοινό διαιρέτη αλλά όχι τον μέγιστο',
 'gcd-vs-lcm':'Μπέρδεψε ΜΚΔ με ΕΚΠ',
 'time-remainder':'Ώρες σε μέρες: ξέχασε τις ώρες που περισσεύουν',
 'time-12':'Μπέρδεψε π.μ. με μ.μ.',
 'time-day':'Λάθος στη μέτρηση των ημερών',
 'blank':'Πήγε να κάνει έλεγχο χωρίς να απαντήσει σε όλα τα ερωτήματα',
 'eucl-rem':'Υπόλοιπο ίσο ή μεγαλύτερο από τον διαιρέτη',
 'fact-product':'Ανάλυση σε παράγοντες που δεν δίνει τον αρχικό αριθμό',
 'digits-partial':'Συμπλήρωση ψηφίου: δεν βρήκε όλες τις λύσεις',
 'crit':'Λάθος σε κριτήριο διαιρετότητας',
 'range-lcm':'Πρόβλημα με όρια: σταμάτησε στο ΕΚΠ',
 'range-rem':'Πρόβλημα με υπόλοιπο: ξέχασε να προσθέσει το υπόλοιπο',
 'years-count':'Μέτρηση φορών: στρογγύλεψε προς τα πάνω'
};

/* ---------- generators ---------- */
function critRule(k){return{
 2:'Ένας αριθμός διαιρείται με το 2 όταν το τελευταίο ψηφίο του είναι 0, 2, 4, 6 ή 8.',
 5:'Ένας αριθμός διαιρείται με το 5 όταν το τελευταίο ψηφίο του είναι 0 ή 5.',
 10:'Ένας αριθμός διαιρείται με το 10 όταν το τελευταίο ψηφίο του είναι 0.',
 4:'Ένας αριθμός διαιρείται με το 4 όταν ο αριθμός που σχηματίζουν τα δύο τελευταία ψηφία του διαιρείται με το 4.',
 25:'Ένας αριθμός διαιρείται με το 25 όταν τα δύο τελευταία ψηφία του είναι 00, 25, 50 ή 75.',
 3:'Ένας αριθμός διαιρείται με το 3 όταν το άθροισμα των ψηφίων του διαιρείται με το 3.',
 9:'Ένας αριθμός διαιρείται με το 9 όταν το άθροισμα των ψηφίων του διαιρείται με το 9.'}[k]}
function critCalc(n,k){const s=String(n),sum=s.split('').reduce((a,d)=>a+ +d,0),yes=n%k===0;
 if(k===2||k===5||k===10)return `Το τελευταίο ψηφίο είναι ${s.at(-1)}.`;
 if(k===4||k===25)return `Τα δύο τελευταία ψηφία σχηματίζουν το ${+s.slice(-2)}, που ${yes?'':'δεν '}διαιρείται με το ${k}.`;
 return `Άθροισμα ψηφίων: ${s.split('').join(' + ')} = ${sum}, που ${yes?'':'δεν '}διαιρείται με το ${k}.`}
function genCritYN(){
 const k=pick([2,3,4,5,9,10,25,3,9,4]),want=Math.random()<.5;let n;
 do{n=rand(100,99999)}while((n%k===0)!==want);
 const yes=n%k===0,concl=`Άρα ο ${n} ${yes?'<b>διαιρείται</b>':'<b>δεν διαιρείται</b>'} με το ${k}.`;
 return{cat:'crit',prompt:`Διαιρείται ο αριθμός <span class="big">${n.toLocaleString('el-GR')}</span> με το <b>${k}</b>;<br><span class="muted">Χρησιμοποίησε κριτήριο, χωρίς να κάνεις τη διαίρεση.</span>`,
  groups:[{label:'',parts:[{type:'yesno',answer:yes}]}],
  hints:[`Ποιο είναι το κριτήριο διαιρετότητας με το ${k};`,critRule(k),critCalc(n,k),concl],
  solution:`${critRule(k)}<br>${critCalc(n,k)}<br>${concl}`,diagnose:()=>[{tag:'crit'}]}}
function genCritDigits(){
 const kinds=[
  {txt:'να διαιρείται με το 3',f:n=>n%3===0,rule:critRule(3),pos:'mid'},
  {txt:'να διαιρείται με το 9',f:n=>n%9===0,rule:critRule(9),pos:'mid'},
  {txt:'να διαιρείται με το 4',f:n=>n%4===0,rule:critRule(4),pos:'tens'},
  {txt:'να διαιρείται με το 3 <b>και</b> το 5',f:n=>n%15===0,last:[0,5],rule:'Για το 5: τελευταίο ψηφίο 0 ή 5. Για το 3: άθροισμα ψηφίων πολλαπλάσιο του 3.',pos:'mid'},
  {txt:'να διαιρείται με το 5 <b>και</b> το 9, <b>αλλά όχι</b> με το 2',f:n=>n%45===0&&n%2===1,last:[5],rule:'Για το 5 αλλά όχι το 2: τελευταίο ψηφίο 5. Για το 9: άθροισμα ψηφίων πολλαπλάσιο του 9.',pos:'mid'},
  {txt:'να διαιρείται με το 2 <b>και</b> το 3',f:n=>n%6===0,last:[0,2,4,6,8],rule:'Για το 2: τελευταίο ψηφίο άρτιο. Για το 3: άθροισμα ψηφίων πολλαπλάσιο του 3.',pos:'mid'}];
 let K,ds,pos,sols;
 do{K=pick(kinds);const len=rand(4,5);ds=[rand(1,9)];for(let i=1;i<len;i++)ds.push(rand(0,9));
  if(K.last)ds[len-1]=pick(K.last);pos=K.pos==='tens'?len-2:rand(1,len-2);
  sols=[...Array(10).keys()].filter(d=>{const c=ds.slice();c[pos]=d;return K.f(+c.join(''))})}while(!sols.length||sols.length===10);
 const shown=ds.map((d,i)=>i===pos?'<span class="gap">?</span>':d).join('');
 const known=ds.reduce((a,d,i)=>i===pos?a:a+d,0);
 const calc=K.pos==='tens'?`Τα δύο τελευταία ψηφία είναι «?${ds.at(-1)}». Δοκίμασε: ${[...Array(10).keys()].map(d=>d+''+ds.at(-1)).join(', ')}. Ποια διαιρούνται με το 4;`
   :`Τα γνωστά ψηφία έχουν άθροισμα ${known}. Πρόσθεσε κάθε ψηφίο 0–9 και δες ποιο άθροισμα ταιριάζει.`;
 const ans=`Τα ψηφία που ταιριάζουν: <b>${sols.join(', ')}</b> (${sols.map(d=>{const c=ds.slice();c[pos]=d;return c.join('')}).join(', ')}).`;
 return{cat:'crit',prompt:`Ποιο ψηφίο μπορεί να μπει στη θέση του <b>?</b> ώστε ο αριθμός <span class="big">${shown}</span> ${K.txt};<br><span class="muted">Διάλεξε <b>όλα</b> τα ψηφία που ταιριάζουν.</span>`,
  groups:[{label:'',parts:[{type:'digits',answer:sols}]}],
  hints:['Θυμήσου τον κανόνα για κάθε διαιρέτη που ζητείται.',K.rule,calc,ans],solution:`${K.rule}<br>${calc.replace('Ποια διαιρούνται με το 4;','')}<br>${ans}`,
  diagnose:v=>{const s=v[0]||[];return s.length&&s.every(d=>sols.includes(d))&&s.length<sols.length?[{tag:'digits-partial',msg:`Όσα διάλεξες είναι σωστά, αλλά υπάρχουν <b>${sols.length}</b> λύσεις συνολικά. Βρες και τις υπόλοιπες!`}]:[{tag:'crit'}]}}}
function genEucl(){
 if(Math.random()<.55){const d=rand(7,25);let D;do{D=rand(120,999)}while(D%d===0);const q=Math.floor(D/d),r=D%d;
  return{cat:'eucl',prompt:`Κάνε την Ευκλείδεια διαίρεση <b>${D} : ${d}</b>. Βρες το πηλίκο και το υπόλοιπο.`,
   groups:[{label:'',parts:[{type:'num',label:'Πηλίκο π =',answer:q},{type:'num',label:'Υπόλοιπο υ =',answer:r}]}],
   hints:[`Πόσες φορές «χωράει» το ${d} στο ${D};`,`${d} · ${q} = ${d*q} και ${d} · ${q+1} = ${d*(q+1)}. Ποιο είναι το πιο κοντά χωρίς να ξεπερνά το ${D};`,`Το πηλίκο είναι ${q}. Το υπόλοιπο είναι ${D} − ${d*q}.`,`π = ${q}, υ = ${r}`],
   solution:`${D} = ${d} · ${q} + ${r}, και ισχύει 0 ≤ ${r} &lt; ${d}. Άρα π = ${q}, υ = ${r}.`,
   diagnose:v=>{const[uq,ur]=v;if(uq!=null&&ur!=null&&d*uq+ur===D&&ur>=d)return[{tag:'eucl-rem',msg:`Η ισότητα ${D} = ${d}·${uq} + ${ur} ισχύει, αλλά το υπόλοιπο πρέπει να είναι <b>μικρότερο από ${d}</b>.`}];return[]}}}
 const d=rand(6,20),q=rand(8,30),D=d*q+d-1;

 app.innerHTML=`<section class="card" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center"><h1>Τέλος γύρου</h1><div class="big" style="font-size:2.6rem">${r.ok} / ${r.n}</div><p style="margin:0">${msg}</p>${nb.map(b=>`<span>🏅 Νέο παράσημο: <b>${b}</b></span>`).join('')}${statsChips()}
 <div class="row" style="justify-content:center"><button class="btn sun" id="again">Νέος γύρος</button><button class="btn ghost" id="home">Αρχική</button></div></section>`;
 document.getElementById('again').onclick=()=>{round={n:10,i:0,ok:0};start(null)};document.getElementById('home').onclick=renderHome}
function renderParent(){const tags=Object.entries(S.tags).sort((a,b)=>b[1]-a[1]);
 app.innerHTML=`<div class="top"><button class="btn ghost" id="home">← Αρχική</button></div><h1>Για τον γονιό</h1>
 <p class="muted" style="margin:0">Η πρόοδος αποθηκεύεται μόνο σε αυτή τη συσκευή και σε αυτόν τον browser.</p>
 <section class="card"><h2 style="margin-bottom:8px">Ανά κατηγορία</h2><div class="tbl"><table class="st"><tr><th>Κατηγορία</th><th>Ερωτήσεις</th><th>Σωστά</th><th>Με την 1η</th><th>Ποσοστό</th></tr>
 ${CATS.map(c=>{const s=cs(c.id);return `<tr><td>${c.t}</td><td>${s.att}</td><td>${s.ok}</td><td>${s.first}</td><td>${s.att?Math.round(s.ok/s.att*100)+'%':'–'}</td></tr>`}).join('')}</table></div></section>
 <section class="card"><h2 style="margin-bottom:8px">Συχνά λάθη</h2>${tags.length?`<div class="tbl"><table class="st"><tr><th>Λάθος</th><th>Φορές</th></tr>${tags.map(([t,n])=>`<tr><td>${TAGS[t]||t}</td><td>${n}</td></tr>`).join('')}</table></div>`:'<p class="muted" style="margin:0">Δεν έχουν καταγραφεί λάθη ακόμα.</p>'}</section>
 <section class="card"><h2 style="margin-bottom:8px">Σύνολο</h2><p style="margin:0">Πόντοι: ${S.points} · Καλύτερο σερί: ${S.best} · Μικτοί γύροι: ${S.rounds.length?S.rounds.join(', ')+' (από 10)':'κανένας'}</p>
 <div style="margin-top:10px" id="rst">${confirmReset?`<div class="confirm"><span>Να σβηστεί όλη η πρόοδος;</span><button class="btn" id="yes" style="background:var(--bad)">Ναι, σβήσ' την</button><button class="btn ghost" id="no">Άκυρο</button></div>`:'<button class="btn ghost" id="reset">Μηδενισμός προόδου</button>'}</div></section>`;
 document.getElementById('home').onclick=()=>{confirmReset=false;view='home';renderHome()};
 const r=document.getElementById('reset');if(r)r.onclick=()=>{confirmReset=true;renderParent()};
 const y=document.getElementById('yes');if(y)y.onclick=()=>{S=fresh();save();confirmReset=false;renderParent()};
 const n=document.getElementById('no');if(n)n.onclick=()=>{confirmReset=false;renderParent()}}
renderHome();
</script>
