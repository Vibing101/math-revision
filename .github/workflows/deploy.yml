name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint (question engine)
        run: cargo clippy -p quiz-core --all-targets -- -D warnings
      - name: Lint (Worker, wasm)
        run: cargo clippy -p site --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test -p quiz-core --release

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://maths.savvy-des.com
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Natural voice (Azure Speech) secrets for the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY || secrets.AZURE_KEY || secrets.AZURE_TTS_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || vars.AZURE_SPEECH_REGION || 'westeurope' }}
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then
            echo "::warning::No AZURE_SPEECH_KEY secret: the lesson videos use the device voice."
            exit 0
          fi
          umask 077
          f="$RUNNER_TEMP/azure-secrets.json"
          node -e 'console.log(JSON.stringify({ AZURE_SPEECH_KEY: process.env.AZURE_SPEECH_KEY.trim(), AZURE_SPEECH_REGION: process.env.AZURE_SPEECH_REGION.trim() }))' > "$f"
          npx wrangler secret bulk "$f"
          rm -f "$f"
      - name: Build and deploy the Rust Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test
        run: |
          sleep 10
          curl -fsS https://maths.savvy-des.com/ | grep -q "Επανάληψη Μαθηματικών"
          curl -fsS "https://maths.savvy-des.com/api/question?cat=pow&seed=1" | grep -q '"cat":"pow"'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://maths.savvy-des.com/api/teacher/resources)" = "401"
          # natural voice: report only (the page falls back to the device voice)
          echo "categories tts flag: $(curl -fsS https://maths.savvy-des.com/api/categories | grep -o '"tts":[a-z]*')"
          curl -s -o /tmp/tts.mp3 -w 'tts: HTTP %{http_code} %{content_type} %{size_download} bytes\n' "https://maths.savvy-des.com/api/tts?cat=c-eq2&seed=1&kind=instr&step=0&k=0&v=m"
          head -c 300 /tmp/tts.mp3 | grep -a error || true
