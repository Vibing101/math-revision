name: Video voice-over

# Makes the MP4 with the Greek voice-over mixed in and commits it to the branch it was started from.
# The narration comes from the live site's /api/video-tts, so no key is needed here.
on:
  workflow_dispatch:
    inputs:
      voice:
        description: Φωνή (e = Ελένη, m = Νέστορας, f = Αθηνά)
        default: e

permissions:
  contents: write

jobs:
  voiceover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Fetch the narration and mix
        working-directory: video/trinomial-factoring
        env:
          VOICE: ${{ inputs.voice || 'e' }}
        run: node voiceover.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: paragontopoiisi-trionymou-voice
          path: video/trinomial-factoring/paragontopoiisi-trionymou-voice.mp4
      - name: Commit the voiced video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video/trinomial-factoring/paragontopoiisi-trionymou-voice.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Video: Greek voice-over"
          git push origin "HEAD:${GITHUB_REF_NAME}"
