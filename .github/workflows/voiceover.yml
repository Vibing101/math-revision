name: Video voice-over

# Speaks the narration of video/trinomial-factoring with the Azure neural voice and commits the voiced MP4
# back to the branch. The Azure key stays in the repository secrets.
on:
  push:
    branches-ignore: [main]
    paths:
      - video/trinomial-factoring/voiceover.mjs
      - video/trinomial-factoring/paragontopoiisi-trionymou.mp4
      - .github/workflows/voiceover.yml
  workflow_dispatch:
    inputs:
      voice:
        description: Φωνή (m = Νέστορας, f = Αθηνά)
        default: m

permissions:
  contents: write

concurrency:
  group: voiceover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voiceover:
    runs-on: ubuntu-latest
    environment: production   # the Azure Speech key is a secret of this environment (as in deploy.yml)
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Speak and mix
        working-directory: video/trinomial-factoring
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY || secrets.AZURE_KEY || secrets.AZURE_TTS_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || vars.AZURE_SPEECH_REGION || 'westeurope' }}
          VOICE: ${{ inputs.voice || 'm' }}
        run: node voiceover.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: paragontopoiisi-trionymou-voice
          path: video/trinomial-factoring/paragontopoiisi-trionymou-voice.mp4
      - name: Commit the voiced video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video/trinomial-factoring/paragontopoiisi-trionymou-voice.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Video: Greek voice-over (Azure neural voice)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
