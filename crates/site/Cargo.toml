[package]
name = "site"
description = "Cloudflare Worker: question API and teacher area for maths.savvy-des.com"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
quiz-core = { path = "../quiz-core" }
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
